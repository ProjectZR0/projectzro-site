<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROJECT // ZRO — Signal Lost</title>
<style>
body{margin:0;background:#02030b;color:#d9ecff;font-family:Arial,sans-serif;
min-height:100vh;display:flex;align-items:center;justify-content:center;
overflow:hidden;position:relative;}
.stars{position:absolute;inset:0;background-image:
radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.4), transparent),
radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.3), transparent),
radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,.35), transparent),
radial-gradient(2px 2px at 85% 20%, rgba(255,255,255,.5), transparent),
radial-gradient(1px 1px at 10% 65%, rgba(255,255,255,.3), transparent),
radial-gradient(1px 1px at 55% 15%, rgba(255,255,255,.4), transparent);
background-size:300px 300px;opacity:.6;}
.wrap{position:relative;width:min(600px,85vw);text-align:center;padding:60px 0;}
.glyph{font-size:2.4rem;opacity:.25;margin-bottom:30px;letter-spacing:.3em;
animation:driftGlyph 8s ease-in-out infinite;}
@keyframes driftGlyph{0%,100%{opacity:.15}50%{opacity:.35}}
.eyebrow{opacity:.5;font-size:.8rem;letter-spacing:.35em;text-transform:uppercase;}
h1{letter-spacing:.15em;font-weight:200;font-size:clamp(1.6rem,5vw,2.4rem);
color:rgba(217,236,255,.55);margin:16px 0 26px;}
.msg{opacity:.55;line-height:1.9;letter-spacing:.03em;font-size:1rem;}
.small{opacity:.4;font-size:.85rem;margin-top:36px;letter-spacing:.2em;text-transform:uppercase;}
a{color:#9fd0ff;text-decoration:none}
.back{display:inline-block;margin-top:50px;}
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">
<div class="glyph">· · ·</div>
<div class="eyebrow">Recovery Failed</div>
<h1>SIGNAL LOST</h1>
<p class="msg">The transmission drifted beyond range.<br>
No coordinates. No anchor. Only the dark between the stars.</p>
<p class="small">STATUS: ADRIFT</p>
<a class="back" href="index.html">← Attempt Reconnection</a>
</div>
</body>
</html>

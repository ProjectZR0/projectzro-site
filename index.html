<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Genesis 003</title><link rel='stylesheet' href='style.css?v=003'></head><body><canvas id='stars'></canvas><div class='nebula'></div><div class='vignette'></div><div id='boot' class='boot'></div><main id='hero' class='hero hidden'><div class='symbol'></div><div class='scan'>TRANSMISSION ESTABLISHED</div><h1>PROJECT // ZRO</h1><div class='line'></div><p>Beyond the edge of known space.</p><div class='buttons'><a href='#'>ENTER</a><a href='#'>ARCHIVE</a></div></main><script src='script.js?v=027'></script>
<div id="zro-signal" aria-hidden="true">
<svg viewBox="0 0 100 100">
<circle cx="50" cy="50" r="18" fill="none" stroke="currentColor" stroke-width="2"/>
<path d="M50 10 L84 70 H16 Z" fill="none" stroke="currentColor" stroke-width="2"/>
</svg>
</div>

<div class="signal-caption">PROJECT // ZRO</div>

<style>
body.transitioning{opacity:0;transition:opacity .9s ease;}
.symbol{cursor:pointer;}
.symbol.warping{animation:warpZoom 1.6s cubic-bezier(.6,0,.9,1) forwards;}
@keyframes warpZoom{
0%{transform:scale(1);opacity:1;}
70%{opacity:1;}
100%{transform:scale(45);opacity:0;}
}
body.warp-flash{animation:warpFlash 1.6s ease forwards;}
@keyframes warpFlash{
0%,60%{background:#02030b;}
100%{background:#fff;}
}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const enter=[...document.querySelectorAll('a')].find(a=>a.textContent.trim().toUpperCase()==='ENTER');
 if(enter){
   enter.addEventListener('click',e=>{
      e.preventDefault();
      document.body.classList.add('transitioning');
      setTimeout(()=>location.href='enter.html',900);
   });
 }

 // Warp button: click the circle for a random chance of drifting elsewhere.
 // Destination pool is intentionally small for now — add more paths here later.
 const WARP_DESTINATIONS = ['void.html'];
 const symbol=document.querySelector('.symbol');
 if(symbol){
   symbol.addEventListener('click',()=>{
     if(symbol.classList.contains('warping'))return;
     symbol.classList.add('warping');
     document.body.classList.add('warp-flash');
     setTimeout(()=>{
       const dest=WARP_DESTINATIONS[Math.floor(Math.random()*WARP_DESTINATIONS.length)];
       location.href=dest;
     },1600);
   });
 }
});
</script>
</body></html>
